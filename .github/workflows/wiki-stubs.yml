name: Wiki stubs

# One job, run by hand, once: replace every page of the old GitHub wiki with a line pointing
# at the documentation site. A wiki page cannot redirect — GitHub sanitises a meta refresh
# out of the Markdown it renders, and there is no HTTP layer to configure — so the reader
# gets a link to click rather than a redirect, and that is the whole of what can be done.
#
# This workflow is deleted once it has been run. It exists as a workflow rather than as a
# script on somebody's laptop because the credential is a repository secret and because the
# next person to ask "how was that done" can read it here.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub:
    # dispatch can be aimed at any ref, and the page list comes from the checkout
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Point every wiki page at the site
        env:
          # GITHUB_TOKEN has no access to <repo>.wiki.git, whatever the contents permission
          # says — the wiki is a separate repository. Nor has a fine-grained PAT: nothing in
          # its permission list covers a wiki.
          #
          # WIKI_TOKEN is a **classic** PAT. On this public repository the single
          # `public_repo` scope is enough — measured, one checkbox and no `repo`.
          #
          # And <repo>.wiki.git does not exist until somebody creates a page in the web UI:
          # before that a push fails with "Repository not found", which reads like the token
          # being wrong when it is the repository being absent.
          TOKEN: ${{ secrets.WIKI_TOKEN }}
          SITE: https://corneizer.github.io/django-aiogram/latest
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo 'WIKI_TOKEN is not set; add a wiki-authorised PAT to repository secrets' >&2
            exit 1
          fi
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

          # every page the wiki currently has, not every page the site has: a reader arrives
          # with a link to a page that existed, and that is the set to answer. `Home` and
          # `_Sidebar` are in it, and the sidebar matters most — it is what somebody sees
          # beside every stub
          for page in wiki/*.md; do
            name=$(basename "$page" .md)
            case "$name" in
              _Sidebar)
                printf '**[The documentation moved](%s/)**\n' "$SITE" > "$page"
                ;;
              Home|index)
                printf '# django-aiogram\n\nThe documentation is at **[%s/](%s/)**.\n\nThis wiki is no longer updated. Every page it had is on the site, under the same name.\n' "$SITE" "$SITE" > "$page"
                ;;
              *)
                printf '# %s\n\nThis page moved to **[%s/%s/](%s/%s/)**.\n\nThe wiki is no longer updated.\n' "$name" "$SITE" "$name" "$SITE" "$name" > "$page"
                ;;
            esac
          done

          cd wiki
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'the wiki already points at the site'
            exit 0
          fi
          git commit -m 'The documentation moved to the site'
          git push
          echo 'every wiki page now points at the site'

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      # every extra, in this job alone: `mypy` checks the whole package, and a transport whose
      # driver is absent is a module it cannot resolve. The stubs in the dev group cover pika,
      # which ships none of its own — but confluent-kafka carries its types *in the package*,
      # so the type check needs the package installed rather than a stub for it.
      #
      # This was found by CI rather than by me: my own `mypy` was green because every driver
      # was in that virtualenv, so the gate I ran was weaker than the one here
      - run: pip install -e '.[redis,rabbitmq,kafka]' --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['5.2', '6.0', '6.1']
        exclude:
          # Django 6.0 and 6.1 require Python 3.12+
          - python-version: '3.10'
            django-version: '6.0'
          - python-version: '3.11'
            django-version: '6.0'
          - python-version: '3.10'
            django-version: '6.1'
          - python-version: '3.11'
            django-version: '6.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[redis]' --group dev 'django~=${{ matrix.django-version }}.0'
      - run: python -m pytest -q

  test-db:
    # the default run ignores tests/db, because tests.settings has no database
    # on purpose — proving the package boots without one is part of the suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[redis]' --group dev
      - run: python -m pytest -q --ds=tests.db_settings tests/db

  test-floors:
    # CI otherwise installs the newest releases, so the declared minimums are
    # never exercised. Exact pins, not 5.2.* — that resolved to 5.2.16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
          # the floor this repository documents: --group is PEP 735, which
          # pip understands from 25.1. Every other job runs the runner's own
          # pip, so CI still exercises the one contributors actually have
          pip-version: '25.1'
      - run: pip install -e '.[redis]' --group dev 'django==5.2.0' 'aiogram==3.30.0' 'redis==6.2.0'
      - run: python -m pytest -q

  integration:
    # fakeredis agrees with everything, so it cannot answer whether LMOVE exists,
    # whether CONFIG SET is refused, or whether FSM state survives a restart
    #
    # RENAMING A LEG BREAKS THE MERGE UNTIL BRANCH PROTECTION IS UPDATED TOO. `master`
    # requires its status checks by *name*, so a leg that changes name leaves the old name
    # required and unreportable — and the merge is refused with "the base branch policy
    # prohibits the merge", which says nothing about why. It cost one refused merge here.
    # After editing this matrix:
    #
    #   gh api repos/OWNER/REPO/branches/master/protection/required_status_checks \
    #     --jq '.checks[].context'        # compare against `gh pr checks <pr>`
    #
    # WALL CLOCK, measured on run 32950644613 rather than estimated: `integration (kafka)`
    # is the only outlier at 154s; every other job in the workflow sits between 60 and 81s,
    # nearly all of it container start and `pip install` rather than tests. Splitting this
    # job by transport takes the workflow from 22 checks to 27. They run in parallel up to
    # the account's concurrency limit, so the cost is roughly one extra job's duration on
    # the tail rather than five, and the slowest job is still Kafka.
    #
    # Kept rather than trimmed, and the trim candidate is named so the next person does not
    # have to guess: `redis streams, floors` goes first. That dimension pins the *library*,
    # and the two transports drive it through the same client — while `valkey` pins the
    # *server*, where Streams and the list use different commands and a fork is exactly
    # where they might diverge.
    #
    # the transport is in the name, not only the dependency set: the list and Streams
    # used to share a leg, so a Streams failure read as `integration (latest)` and the
    # log was the only place that said which contract had broken
    name: integration (${{ matrix.transport }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # both ends of the supported range against a real server. Running only
        # the latest is what let a broken redis floor ship: the unit suite uses
        # fakeredis, which has the aclose() that redis-py 5.0 lacked
        include:
          - transport: redis list
            suite: tests/integration/test_delivery_against_redis.py
            deps: latest
            pins: ''
            image: redis:7
          - transport: redis list
            suite: tests/integration/test_delivery_against_redis.py
            deps: floors
            pins: "'django==5.2.0' 'aiogram==3.30.0' 'redis==6.2.0'"
            image: redis:7
          # the fork most managed providers actually run. It answers the same
          # protocol, which is an assumption worth testing rather than assuming
          - transport: redis list
            suite: tests/integration/test_delivery_against_redis.py
            deps: valkey
            pins: ''
            image: valkey/valkey:8
          - transport: redis streams
            suite: tests/integration/test_streams_against_redis.py
            deps: latest
            pins: ''
            image: redis:7
          - transport: redis streams
            suite: tests/integration/test_streams_against_redis.py
            deps: floors
            pins: "'django==5.2.0' 'aiogram==3.30.0' 'redis==6.2.0'"
            image: redis:7
          - transport: redis streams
            suite: tests/integration/test_streams_against_redis.py
            deps: valkey
            pins: ''
            image: valkey/valkey:8
          # the only server that can run the Streams refusal, and until now nothing did:
          # below 7.0 `XINFO GROUPS` has no `lag` field, so the transport raises rather than
          # guessing a depth a healthcheck would act on. Every other case in that module
          # skips here, which is the point — measured against 6.2.24, where the refusal is
          # the one case that runs
          - transport: redis streams
            suite: tests/integration/test_streams_against_redis.py
            deps: old server
            pins: ''
            image: redis:6.2
          # the rest of the integration suite belongs to neither transport: the async
          # producer and FSM-across-restart cases are about the client and the storage
          - transport: redis shared
            suite: >-
              tests/integration/test_async_producer_against_redis.py
              tests/integration/test_fsm_across_restart.py
            deps: latest
            pins: ''
            image: redis:7
    services:
      redis:
        image: ${{ matrix.image }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[redis]' --group dev ${{ matrix.pins }}
      - run: python -m pytest -q -m integration ${{ matrix.suite }}
        env:
          DJANGO_AIOGRAM_TEST_REDIS_URL: redis://localhost:6379/0
      # the contract against a real server, which it had never faced: the fixture
      # falls back to fakeredis without this variable, and a double cannot report a
      # disagreement. The RabbitMQ and Kafka legs already run it against theirs
      - run: python -m pytest -q tests/test_broker_conformance.py
        env:
          DJANGO_AIOGRAM_TEST_REDIS_URL: redis://localhost:6379/0

  integration-amqp:
    # a job of its own rather than a rabbitmq service on all three redis legs: the
    # transports share no server, and the redis matrix is about redis versions
    name: integration (rabbitmq)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[redis,rabbitmq]' --group dev
      # the conformance suite as well as the transport's own module: the contract is what
      # makes a second backend worth having, and it only runs against RabbitMQ where a
      # broker exists. Without this leg those twelve cases skip and nobody hears them
      - run: python -m pytest -q tests/test_broker_conformance.py
        env:
          DJANGO_AIOGRAM_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
      # the durability case needs the broker *stopped*, which no client can arrange. A service
      # container's name is generated by the runner -- `<hash>_rabbitmq4_<hash>` -- so it is
      # looked up rather than guessed.
      #
      # Matched on the substring and NOT on `ancestor=rabbitmq:4`, and failing when it finds
      # nothing, because the two together are the difference between coverage and the
      # appearance of it: unset, the fixture skips, and a leg that skipped its only durability
      # case is as green as one that ran it. An image bump would have done exactly that
      - name: name the broker container for the restart case
        run: |
          name=$(docker ps --filter name=rabbitmq --format '{{.Names}}')
          echo "resolved rabbitmq container: ${name:-<none>}"
          test "$(printf '%s' "$name" | grep -c .)" = 1 || {
            echo "::error::expected exactly one running rabbitmq container; the restart case would have skipped"
            exit 1
          }
          echo "DJANGO_AIOGRAM_TEST_AMQP_CONTAINER=$name" >> "$GITHUB_ENV"
      - run: python -m pytest -q -m integration tests/integration/test_rabbitmq_against_broker.py
        env:
          DJANGO_AIOGRAM_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/

  integration-kafka:
    # its own job for the reason the rabbitmq one has its own: the transports share no server
    name: integration (kafka)
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.0.0
        ports: ['9092:9092']
        env:
          # KRaft, single node, and a listener the runner can reach. The image's own default
          # advertises `localhost:9092` from inside the container, which a client on the host
          # cannot connect to — it retries into a refusal loop rather than failing, which is
          # how the first attempt at this measurement spent ten minutes
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[redis,kafka]' --group dev
      # a broker with no readiness probe of its own, so this waits for one it can use: the
      # metadata request an ordinary client makes. `sleep`ing a guessed number of seconds is
      # how a suite starts failing on a slow runner and nowhere else
      - run: |
          python - <<'PY'
          import time
          from confluent_kafka.admin import AdminClient
          admin = AdminClient({'bootstrap.servers': 'localhost:9092'})
          for attempt in range(60):
              try:
                  admin.list_topics(timeout=5)
              except Exception as error:  # noqa: BLE001
                  print(f'not ready ({attempt}): {error}')
                  time.sleep(2)
              else:
                  print(f'ready after {attempt} attempt(s)')
                  break
          else:
              raise SystemExit('kafka never became ready')
          PY
      # the conformance suite as well as the transport's own module, for the reason the
      # rabbitmq leg runs it: those cases skip without a broker and nobody hears them
      - run: python -m pytest -q tests/test_broker_conformance.py
        env:
          DJANGO_AIOGRAM_TEST_KAFKA_BOOTSTRAP: localhost:9092
      # as on the RabbitMQ leg, including the refusal to continue without it: a skip here
      # would leave the leg green with its durability case never run
      - name: name the broker container for the restart case
        run: |
          name=$(docker ps --filter name=kafka --format '{{.Names}}')
          echo "resolved kafka container: ${name:-<none>}"
          test "$(printf '%s' "$name" | grep -c .)" = 1 || {
            echo "::error::expected exactly one running kafka container; the restart case would have skipped"
            exit 1
          }
          echo "DJANGO_AIOGRAM_TEST_KAFKA_CONTAINER=$name" >> "$GITHUB_ENV"
      - run: python -m pytest -q -m integration tests/integration/test_kafka_against_broker.py
        env:
          DJANGO_AIOGRAM_TEST_KAFKA_BOOTSTRAP: localhost:9092
      # and the transport's unit module, which needs no broker but does need the driver: one of
      # its cases reaches a method that imports it, and this is the only leg that installs it
      - run: python -m pytest -q tests/test_kafka_publish.py

  smoke:
    # the unit suite imports from src/, so only an install can catch a packaging
    # mistake: a missing py.typed, a module left out of the wheel
    runs-on: ubuntu-latest
    services:
      # so the healthcheck's *success* path runs too. Without a server the script can
      # only prove the probe refuses an unreachable Redis, which a probe that answered
      # `unreachable` to everything would also pass — while returning non-zero for every
      # healthy container in a compose file that follows the Deployment page
      redis:
        image: redis:8
        ports: ['6399:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DJANGO_AIOGRAM_TEST_REDIS_URL: redis://127.0.0.1:6399/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: pip install build
      - run: bash scripts/smoke_install.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel must carry the typing marker
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected_names = (
              'django_aiogram/py.typed',
              'django_aiogram/api.py',
              'django_aiogram/migrations/0001_initial.py',
          )
          for expected in expected_names:
              assert expected in names, f'{expected} missing from {wheel}: {names}'
          # 3.0 removed the 1.x package name; shipping it again would be silent
          shim = [n for n in names if n == 'telegram_bot.py' or n.startswith('telegram_bot/')]
          assert not shim, f'the removed telegram_bot package is back in {wheel}: {shim}'
          print(f'{wheel} ships py.typed and not the 1.x name')
          EOF

name: Pages

# The documentation site, published to GitHub Pages from `master`.
#
# **Versioned by `mike`**, which keeps one directory per release series on the `gh-pages`
# branch and a `versions.json` the theme's selector reads. A push to `master` deploys the
# series `__version__` names, and nothing else deploys. A series freezes by itself the day
# `__version__` moves past it: 5.0 starts publishing into `/5.0/`, and `/4.0/` keeps the last
# thing 4.x said, for as long as anyone is still running it.
#
# **`latest` moves only for a final release.** It is the URL the README and PyPI point at, so
# an unreleased version publishing into it tells everyone running the *released* package about
# settings it does not have — measured against 4.1, whose unreleased pages were `/latest/` for
# the length of its development. Final means a plain version, optionally with a `.postN`: a
# `.devN` is not one, and neither is an `a`, `b` or `rc`, which a major is exactly where you
# cut. Such a version still publishes under its own series and is reachable from the version
# selector; `latest` stays where the last release put it.
#
# Pages must be served from the **`gh-pages` branch**, not from "GitHub Actions". With the
# wrong source this workflow goes green, `mike` pushes, and the site never changes — no error
# anywhere. It is the first thing to check if a deploy appears to do nothing.

on:
  push:
    branches: [master]
    paths:
      - 'docs/wiki/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
      - 'src/django_aiogram/__init__.py'
  workflow_dispatch:

# `mike` pushes to `gh-pages`, so this is the one workflow here that writes to the
# repository. Every other job in this repository runs with `contents: read`
permissions:
  contents: write

concurrency:
  group: pages
  # NOT cancel-in-progress, unlike the rest of this repository: `mike` rewrites
  # `versions.json` and the version directory in separate commits, and a run cancelled
  # between them leaves the selector offering a version whose directory is not there
  cancel-in-progress: false

jobs:
  deploy:
    # `workflow_dispatch` can be aimed at any ref, and publishing from one would put
    # unreviewed pages on the site
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the whole history for two reasons: `mike` needs the `gh-pages` branch it is
          # about to rewrite, and `git-revision-date-localized` stamps each page with its
          # last commit — with a shallow clone it silently falls back to the build date
          fetch-depth: 0
          # and the credential stays, unlike everywhere else here: this job pushes
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install --group docs

      - name: The series this site is for
        id: series
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re, sys

          source = pathlib.Path('src/django_aiogram/__init__.py').read_text()
          version = re.search(r"__version__ = '(.+?)'", source).group(1)
          # from the numeric head, so a pre-release lands in its own release's series:
          # `5.0.0rc1` publishes into `/5.0/` rather than into `/5.0.0rc1/`
          series = '.'.join(re.match(r'(\d+)\.(\d+)', version).groups())
          # `latest` is the URL the README and PyPI point at, so only a *final* release may
          # take it. `.dev` is not the only thing that is not one -- an `a`, `b` or `rc` is a
          # pre-release too, and a major is exactly where one gets cut. A `.postN` is final
          final = re.fullmatch(r'\d+(\.\d+)*(\.post\d+)?', version) is not None
          print(f'series={series}')
          print(f'alias={"latest" if final else ""}')
          print(f'publishing {version} as {series}{", aliased latest" if final else ""}', file=sys.stderr)
          PY

      - name: Deploy
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mike deploy --push --update-aliases '${{ steps.series.outputs.series }}' ${{ steps.series.outputs.alias }}
          # the redirect at the site root. Without it `/django-aiogram/` is a 404 — and that
          # is the URL `project.urls.Documentation` points PyPI at. Set whatever this push
          # published, because `latest` is where the last release left it
          mike set-default --push latest

      # Pages serves the branch asynchronously, so this waits rather than asserting once. It
      # is the only check that can catch the source being set to "GitHub Actions", which is
      # invisible from inside the workflow: everything above would still succeed
      - name: The site answers
        env:
          ROOT: https://corneizer.github.io/django-aiogram/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 20 -o /dev/null "${ROOT}latest/"; then
              echo "the site answers after ${attempt} attempt(s)"
              curl -fsS --max-time 20 -o versions.json "${ROOT}versions.json"
              python -c "import json,sys; v=json.load(open('versions.json')); a={x for e in v for x in e['aliases']}; print('versions:', sorted(e['version'] for e in v), 'aliases:', sorted(a)); sys.exit(0 if 'latest' in a else 'versions.json has no latest alias')"
              curl -fsS --max-time 20 -o /dev/null "${ROOT}latest/Delivery/"
              echo 'a page and the version manifest both answer'
              exit 0
            fi
            sleep 15
          done
          echo '::error::the site did not answer; check Settings -> Pages is serving the gh-pages branch'
          exit 1
